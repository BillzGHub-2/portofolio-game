<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Billy | Portofolio Game Developer</title>
    <!-- Memuat Plus Jakarta Sans untuk ujung huruf lancip & Bricolage Grotesque -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #f8f4ea;
            --sea: #cdeaf5;
            --panel: #fffdf8;
            --text: #0b3b57;
            --muted: #4f7488;
            --accent: #0a7fb0;
            --ink: #fff;
            --line: #e4d9c2;
            --screen: #051a27;
            --dark: #06202f;
            --ease: cubic-bezier(.2,.8,.2,1);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top,0px);
            padding-bottom: env(safe-area-inset-bottom,0px)
        }

        html {
            scroll-padding-top: calc(env(safe-area-inset-top,0px) + 70px);
            -webkit-text-size-adjust: 100%
        }

        *, *::before, *::after {
            box-sizing: border-box
        }

        ::selection {
            background: var(--accent);
            color: #fff
        }

        body {
            margin: 0;
            overflow-x: clip;
            background-color: var(--bg);
            background-image: linear-gradient(180deg,var(--sea),var(--bg) 560px);
            background-repeat: no-repeat;
            color: var(--text);
            font: 16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            -webkit-tap-highlight-color: transparent
        }

        h1, h2, h3 {
            font-family: "Plus Jakarta Sans", "Bricolage Grotesque", system-ui, sans-serif;
            margin: 0;
            line-height: 1.15;
            letter-spacing: -.02em
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 20px
        }

        a {
            color: inherit
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px
        }

        /* progress, curtain, cursor */
        #prog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            transform-origin: 0 50%;
            transform: scaleX(0);
            z-index: 60
        }

        #curtain {
            position: fixed;
            inset: 0;
            background: var(--dark);
            z-index: 90;
            pointer-events: none;
            display: grid;
            place-items: center;
            clip-path: inset(0)
        }

            #curtain span {
                font: 800 clamp(34px,8vw,84px) "Plus Jakarta Sans", "Bricolage Grotesque", system-ui, sans-serif;
                color: #eaf6fb;
                letter-spacing: -.03em
            }

        #ring {
            position: fixed;
            left: 0;
            top: 0;
            width: 36px;
            height: 36px;
            margin: -18px 0 0 -18px;
            pointer-events: none;
            z-index: 200;
            display: none
        }

        .cur #ring {
            display: block
        }

        #ring::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 1.5px solid var(--accent);
            border-radius: 50%;
            transition: transform .3s var(--ease),background .3s
        }

        #ring::after {
            content: "+";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 20px;
            opacity: 0;
            transition: opacity .2s
        }

        #ring.h::before {
            transform: scale(1.7);
            background: rgba(10,127,176,.14)
        }

        #ring.z::before {
            transform: scale(2.2);
            background: rgba(10,127,176,.92)
        }

        #ring.z::after {
            opacity: 1
        }

        /* header */
        header {
            position: sticky;
            top: env(safe-area-inset-top,0px);
            z-index: 40;
            padding: 16px 0;
            transition: background .3s,backdrop-filter .3s,border-color .3s;
            border-bottom: 1px solid transparent
        }

            header.sc {
                background: color-mix(in srgb,var(--bg) 78%,transparent);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border-color: var(--line)
            }

        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        header a#brand {
            font: 800 20px "Plus Jakarta Sans", "Bricolage Grotesque", system-ui, sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px
        }

            header a#brand::before {
                content: "";
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--accent);
                animation: pulse 2.4s ease-out infinite
            }

        /* language switcher */
        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 3px 6px;
            box-shadow: 0 4px 12px rgba(10,127,176,.08)
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 800;
            color: var(--muted);
            transition: background .2s, color .2s
        }

            .lang-btn:hover {
                color: var(--text)
            }

            .lang-btn.active {
                background: var(--accent);
                color: #fff
            }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(10,127,176,.5)
            }

            100% {
                box-shadow: 0 0 0 12px rgba(10,127,176,0)
            }
        }

        /* reveal system & text clip fix */
        .w {
            display: inline-block;
            overflow: hidden;
            vertical-align: top;
            padding: .04em .06em .45em;
            margin-bottom: -.45em
        }

            .w > span {
                display: inline-block;
                padding-bottom: .22em;
                margin-bottom: -.22em;
                transform: translateY(125%);
                transition: transform 1s var(--ease);
                transition-delay: calc(var(--i) * 70ms)
            }

        .go .w > span {
            transform: none
        }

        .go .w {
            overflow: visible
        }

        .ac > span {
            background: linear-gradient(100deg,var(--accent),#2bb6c9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            padding-bottom: .22em;
            margin-bottom: -.22em;
            display: inline-block
        }

        .rv {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity .9s ease,transform .9s var(--ease);
            transition-delay: var(--d,0ms)
        }

            .rv.v {
                opacity: 1;
                transform: none
            }

        /* hero (Ujung kanan 'y' lancip & proporsional) */
        .hero {
            position: relative;
            isolation: isolate;
            padding: clamp(36px,9vw,110px) 0 8px
        }

            .hero h1 {
                font-family: "Plus Jakarta Sans", "Bricolage Grotesque", system-ui, sans-serif;
                font-size: clamp(40px,9.5vw,118px);
                font-weight: 800;
                letter-spacing: -.03em;
                line-height: 1.22;
                padding-bottom: 4px
            }

        .lead {
            margin: 22px 0 0;
            font-size: clamp(16px,2vw,19px);
            color: var(--muted);
            max-width: 56ch;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .9s .55s,transform .9s .55s var(--ease)
        }

        .go .lead {
            opacity: 1;
            transform: none
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .55;
            pointer-events: none;
            z-index: -1;
            translate: calc(var(--px,0) * 32px) calc(var(--py,0) * 32px);
            transition: translate .8s ease-out
        }

        .b1 {
            width: 42vw;
            max-width: 460px;
            aspect-ratio: 1;
            background: #7fd3ea;
            top: -40px;
            right: -4%;
            animation: fl 14s ease-in-out infinite alternate
        }

        .b2 {
            width: 34vw;
            max-width: 360px;
            aspect-ratio: 1;
            background: #f6d79a;
            bottom: -60px;
            left: 28%;
            animation: fl 18s ease-in-out -6s infinite alternate
        }

        @keyframes fl {
            to {
                transform: translate(40px,30px) scale(1.12)
            }
        }

        /* marquee */
        .mq {
            overflow: hidden;
            margin: 56px 0 52px calc(50% - 50vw);
            width: 100vw;
            padding: 16px 0
        }

        .mqt {
            display: flex;
            align-items: center;
            width: max-content;
            animation: mq 42s linear infinite
        }

            .mqt span {
                font: 800 clamp(34px,7vw,88px)/1.32 "Plus Jakarta Sans", "Bricolage Grotesque", system-ui, sans-serif;
                letter-spacing: -.03em;
                color: transparent;
                -webkit-text-stroke: 1.5px var(--text);
                padding: .12em .3em .32em;
                white-space: nowrap;
                display: inline-block;
                transition: color .3s
            }

                .mqt span:hover {
                    color: var(--text)
                }

            .mqt b {
                color: var(--accent);
                align-self: center;
                font-size: clamp(20px,3vw,36px)
            }

        @keyframes mq {
            to {
                transform: translateX(-50%)
            }
        }

        /* cards: 5 Porto Utama Seragam */
        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px
        }

            .cards > div.rv {
                flex: 0 0 calc((100% - 40px) / 3);
                width: calc((100% - 40px) / 3);
                max-width: calc((100% - 40px) / 3);
                display: flex
            }

        @media (max-width: 960px) {
            .cards > div.rv {
                flex: 0 0 calc((100% - 20px) / 2);
                width: calc((100% - 20px) / 2);
                max-width: calc((100% - 20px) / 2);
            }
        }

        @media (max-width: 600px) {
            .cards > div.rv {
                flex: 0 0 100%;
                width: 100%;
                max-width: 100%;
            }
        }

        /* experimental cards: Besar di Tengah */
        .cards.exp-cards > div.rv {
            flex: 0 1 540px;
            width: 100%;
            max-width: 540px
        }

        .gcard {
            flex: 1;
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            text-decoration: none;
            display: block;
            transform: perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
            transition: transform .25s ease-out,border-color .25s,box-shadow .4s
        }

            .gcard::after {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                opacity: 0;
                transition: opacity .3s;
                background: radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.3),transparent 60%)
            }

            .gcard:hover {
                border-color: var(--accent);
                box-shadow: 0 28px 50px -28px rgba(10,127,176,.55)
            }

                .gcard:hover::after {
                    opacity: 1
                }

        .cover {
            position: relative;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg,var(--g1),var(--g2));
            overflow: hidden
        }

            .cover img, .gal img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block
            }

            .cover img {
                transition: transform .9s var(--ease)
            }

        .gcard:hover .cover img {
            transform: scale(1.07)
        }

        .num {
            position: absolute;
            left: 14px;
            top: 12px;
            font: 800 13px "Plus Jakarta Sans", system-ui, sans-serif;
            font-style: normal;
            color: #fff;
            background: rgba(5,26,39,.55);
            backdrop-filter: blur(6px);
            border-radius: 99px;
            padding: 2px 10px
        }

        .arr {
            position: absolute;
            right: 12px;
            top: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            color: var(--text);
            display: grid;
            place-items: center;
            font-style: normal;
            transform: translate(8px,-8px) scale(.6);
            opacity: 0;
            transition: transform .4s var(--ease),opacity .3s
        }

        .gcard:hover .arr {
            transform: none;
            opacity: 1
        }

        .gbody {
            padding: 16px 18px 18px
        }

            .gbody h2 {
                font-size: 24px
            }

            .gbody span {
                font-size: 13px;
                color: var(--muted);
                display: inline-block;
                margin-top: 2px
            }

            .gbody p {
                margin: 8px 0 0;
                font-weight: 600;
                font-size: 15px
            }

        .top {
            padding-top: 8px
        }

            .top h1 {
                font-size: clamp(34px,7vw,76px);
                font-weight: 800;
                letter-spacing: -.035em;
                line-height: 1.15
            }

            .top p {
                max-width: 64ch;
                color: var(--muted);
                margin: 16px 0 0;
                font-size: 16px
            }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 99px;
            padding: 3px 12px;
            font-size: 12.5px;
            font-weight: 500;
            transition: background .2s,color .2s,border-color .2s
        }

            .chip:hover {
                background: var(--text);
                color: #fff;
                border-color: var(--text)
            }

        /* stage */
        .stage {
            background: var(--panel);
            border: 2px solid var(--line);
            border-radius: 22px;
            padding: 10px;
            margin: 28px auto 0;
            max-width: 780px;
            box-shadow: 0 40px 70px -40px rgba(10,127,176,.5)
        }

        .screen {
            aspect-ratio: 16/9;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            display: grid;
            place-items: center;
            color: #f4fbff;
            background: #051a27
        }

            .screen iframe, .screen video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
                background: #000;
                object-fit: cover
            }

            .screen .gif-view {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #051a27;
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges
            }

        .empty {
            text-align: center;
            padding: 20px;
            max-width: 460px;
            background: color-mix(in srgb,var(--screen) 80%,transparent);
            border-radius: 16px
        }

            .empty h3 {
                font-size: 22px;
                margin-bottom: 6px
            }

            .empty p {
                margin: 0 0 12px;
                font-size: 14px;
                color: #cfe6f1
            }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px
        }

            .row input[type=text] {
                flex: 1 1 200px;
                min-width: 0;
                padding: 10px 12px;
                border-radius: 8px;
                border: 1px solid #3f7a99;
                background: #0a2f45;
                color: #f4fbff;
                font-size: 14px
            }

        /* Tombol yang Selalu Centered Vertikal dan Horizontal */
        .btn {
            background: var(--accent);
            color: var(--ink);
            border: 0;
            border-radius: 99px;
            padding: 12px 22px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 48px;
            line-height: 1.35;
            transition: background .25s,border-color .25s,color .25s,transform .3s var(--ease)
        }

            .btn.alt {
                background: transparent;
                border: 1px solid currentColor;
                font-weight: 600;
                color: inherit
            }

                .btn.alt:hover {
                    background: var(--text);
                    color: #fff;
                    border-color: var(--text)
                }

            .btn:not(.alt):hover {
                background: var(--text)
            }

            .btn.ok {
                background: var(--accent) !important;
                color: #fff !important;
                border-color: var(--accent) !important
            }

        /* sections */
        .sec {
            padding: 56px 0 0
        }

            .sec h2 {
                font-size: clamp(26px,4vw,40px);
                margin-bottom: 8px;
                position: relative;
                display: inline-block
            }

                .sec h2::after {
                    content: "";
                    position: absolute;
                    left: 0;
                    bottom: -6px;
                    height: 3px;
                    width: 100%;
                    background: var(--accent);
                    border-radius: 3px;
                    transform: scaleX(0);
                    transform-origin: 0 50%;
                    transition: transform 1s .3s var(--ease)
                }

            .sec.v h2::after {
                transform: scaleX(.18)
            }

            .sec > p {
                margin: 12px 0 16px;
                color: var(--muted);
                max-width: 64ch;
                font-size: 15px
            }

        .gal {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
            gap: 14px;
            margin-top: 22px
        }

            .gal figure {
                position: relative;
                margin: 0;
                aspect-ratio: 16/10;
                border-radius: 16px;
                overflow: hidden;
                border: 1px solid var(--line);
                background: var(--panel)
            }

                .gal figure.v {
                    transition: transform .4s var(--ease),box-shadow .4s,opacity .9s
                }

                    .gal figure.v:hover {
                        transform: translateY(-4px);
                        box-shadow: 0 24px 40px -26px rgba(10,127,176,.6)
                    }

                .gal figure:has(img) {
                    cursor: zoom-in
                }

                    .gal figure:has(img)::after {
                        content: "+";
                        position: absolute;
                        right: 10px;
                        bottom: 10px;
                        width: 34px;
                        height: 34px;
                        border-radius: 50%;
                        background: rgba(5,26,39,.72);
                        color: #fff;
                        display: grid;
                        place-items: center;
                        font-size: 21px;
                        line-height: 1;
                        backdrop-filter: blur(6px);
                        transition: transform .3s var(--ease),background .3s
                    }

                    .gal figure:has(img):hover::after {
                        transform: scale(1.15);
                        background: var(--accent)
                    }

            .gal img {
                transition: transform .9s var(--ease)
            }

            .gal figure:hover img {
                transform: scale(1.06)
            }

        .slot {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
            cursor: pointer;
            background: repeating-linear-gradient(135deg,var(--panel),var(--panel) 10px,var(--bg) 10px,var(--bg) 20px)
        }

        .role {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 22px
        }

            .role b {
                font: 700 20px "Plus Jakarta Sans", system-ui, sans-serif;
                display: block
            }

            .role ul {
                margin: 12px 0 0;
                padding-left: 20px;
                color: var(--muted);
                columns: 2 260px;
                column-gap: 28px
            }

            .role li {
                margin-bottom: 8px;
                break-inside: avoid;
                font-size: 15px;
                opacity: 0;
                transform: translateX(-12px);
                transition: opacity .7s,transform .7s var(--ease);
                transition-delay: calc(var(--k) * 90ms + 250ms)
            }

            .role.v li, .job.v li {
                opacity: 1;
                transform: none
            }

        .work {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
            gap: 18px
        }

        .job {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 20px
        }

            .job.v {
                transition: transform .35s var(--ease),border-color .3s,box-shadow .4s,opacity .9s
            }

                .job.v:hover {
                    transform: translateY(-5px);
                    border-color: var(--accent);
                    box-shadow: 0 26px 44px -30px rgba(10,127,176,.6)
                }

            .job h3 {
                font-size: 20px
            }

            .job .tag {
                font-size: 12.5px;
                color: var(--accent);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: .03em
            }

            .job p {
                margin: 8px 0 12px;
                color: var(--muted);
                font-size: 14.5px
            }

            .job ol {
                margin: 0;
                padding: 0;
                list-style: none;
                counter-reset: s
            }

            .job li {
                counter-increment: s;
                display: flex;
                gap: 10px;
                margin-bottom: 8px;
                font-size: 14.5px;
                opacity: 0;
                transform: translateX(-12px);
                transition: opacity .7s,transform .7s var(--ease);
                transition-delay: calc(var(--k) * 110ms + 300ms)
            }

                .job li::before {
                    content: counter(s);
                    flex: 0 0 22px;
                    height: 22px;
                    border-radius: 50%;
                    background: var(--accent);
                    color: var(--ink);
                    font-weight: 800;
                    font-size: 12px;
                    display: grid;
                    place-items: center;
                    margin-top: 2px
                }

        /* Navigasi Porto: Selalu Seimbang dan Center */
        .next {
            margin-top: 56px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 12px;
            flex-wrap: wrap
        }

            .next .btn {
                flex: 1 1 200px;
                max-width: 320px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 12px 20px
            }

        /* footer */
        .foot {
            margin-top: 90px;
            background: var(--dark);
            color: #eaf6fb;
            border-radius: 36px 36px 0 0;
            padding: clamp(44px,8vw,84px) 0 48px
        }

            .foot .fin {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 28px;
                flex-wrap: wrap
            }

            .foot h2 {
                font-size: clamp(28px,5vw,60px);
                letter-spacing: -.035em;
                max-width: 15ch;
                margin: 0
            }

            .foot .row {

        $("brand").textContent = SITE.name;

        $("cta").textContent = t.cta;

        /* Render tombol kontak */
        const contactsHTML = SITE.contacts.map(c => {
        if(c.isCopy) return `<button class="btn alt" onclick="copyEmail('${c.email}', this)">${c.label}</button>`;
        return `<a class="btn alt" href="${c.href}" target="_blank" rel="noopener">${c.label}</a>`;

        $("contacts").innerHTML = contactsHTML;

        function copyEmail(email, btn){
        const t = I18N[currentLang];
        navigator.clipboard.writeText(email).then(() => {
        const orig = btn.textContent;
        btn.textContent = t.copied;
        btn.classList.add("ok");
        setTimeout(() => { btn.textContent = orig; btn.classList.remove("ok"); }, 2000);
        }).catch(() => {
        prompt(t.copyPrompt, email);
        });

        window.copyEmail = copyEmail;

        function ytId(v){const m = String(v).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : "")}

        function play(kind, val){
        if(kind === "yt"){
        $("screen").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${val}" title="Video gameplay" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        } else if(/\.gif($|\?)/i.test(val)){
        $("screen").innerHTML = `<img src="${val}" alt="Cuplikan gameplay animasi" class="gif-view" loading="lazy">`;
        } else {
        $("screen").innerHTML = `<video src="${val}" controls autoplay loop muted playsinline></video>`;
        }
        }

        ${exp.length ? `<section class="sec rv"><h2>${t.expTitle}</h2>
        <p>${t.expDesc}</p>
        <div class="cards exp-cards">${exp.map(card).join("")}</div></section>` : ""}`;
        }

        function game(g, idx){
        const t = I18N[currentLang];
        document.title = g.title + " | " + SITE.name;
        const n = Math.max(3, g.photos.length);
        const prevIdx = (idx - 1 + GAMES.length) % GAMES.length;
        const nxIdx = (idx + 1) % GAMES.length;
        const prv = GAMES[prevIdx], nx = GAMES[nxIdx];
        const prvTitle = prv.experimental ? t.expTitle : prv.title;
        const nxTitle = nx.experimental ? t.expTitle : nx.title;

        const descText = (currentLang === "en" && g.desc_en) ? g.desc_en : g.desc;
        const genreText = (currentLang === "en" && g.genre_en) ? g.genre_en : g.genre;
        const statusText = (currentLang === "en" && g.status_en) ? g.status_en : g.status;
        const roleText = (currentLang === "en" && g.role_en) ? g.role_en : g.role;
        const dutiesList = (currentLang === "en" && g.duties_en) ? g.duties_en : g.duties;
        const methodText = (currentLang === "en" && g.method_en) ? g.method_en : g.method;

        app.innerHTML = `<div class="top"><h1>${words(g.title)}</h1><p class="lead">${descText}</p>
        <div class="chips rv" style="--d:300ms"><span class="chip">${genreText}</span><span class="chip">${statusText}</span>${g.tags.map(tag => `<span class="chip">${tag}</span>`).join("")}</div></div>
        <div class="stage rv" style="--d:150ms"><div class="screen" id="screen" style="--g1:${g.g[0]};--g2:${g.g[1]}"></div></div>
        <section class="sec"><h2 class="rv">${t.secPhotos}</h2><div class="gal">${Array.from({length: n}, (_, i) => `<figure class="rv${g.photos[i] ? " zm" : ""}" style="--d:${i * 110}ms"${g.photos[i] ? ` tabindex="0" role="button" aria-label="${t.zoomPhoto} ${i + 1}"` : ""}>${slot(i, g.photos[i])}</figure>`).join("")}</div></section>
        <section class="sec"><h2 class="rv">${t.secRole}</h2><div class="role rv"><b>${roleText}</b><ul>${dutiesList.map((d, k) => `<li style="--k:${k}">${d}</li>`).join("")}</ul></div></section>
        <section class="sec"><h2 class="rv">${t.secWork}</h2><p class="rv">${methodText}</p>
        <div class="work">${g.work.map((w, k) => {
        const workTitle = (currentLang === "en" && w.t_en) ? w.t_en : w.t;
        const workTag = (currentLang === "en" && w.tag_en) ? w.tag_en : w.tag;
        const workWhat = (currentLang === "en" && w.what_en) ? w.what_en : w.what;
        const workHow = (currentLang === "en" && w.how_en) ? w.how_en : w.how;
        return `<article class="job rv" style="--d:${k * 110}ms"><span class="tag">${workTag}</span><h3>${workTitle}</h3><p>${workWhat}</p><ol>${workHow.map((h, j) => `<li style="--k:${j}">${h}</li>`).join("")}</ol></article>`;
        }).join("")}</div></section>
        <div class="next rv">
         ${GAMES.length > 1 ? `<a class="btn alt" href="#/g/${prv.id}">← ${prvTitle}</a>` : ""}
         <a class="btn alt" href="#/">${t.btnAll}</a>
         ${GAMES.length > 1 ? `<a class="btn" href="#/g/${nx.id}">${nxTitle} →</a>` : ""}
         </div>`;

        const id = g.youtube && ytId(g.youtube);
        id ? play("yt", id) : g.src ? play("file", g.src) : showEmpty();

        app.querySelectorAll(".slot input").forEach(inp => inp.onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const fig = inp.closest("figure");
        fig.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Cuplikan layar">`;
        fig.classList.add("zm"); fig.tabIndex = 0; fig.setAttribute("role", "button"); fig.setAttribute("aria-label", t.zoomPhoto);
        });
        }

        /* ============ EFEK & INTERAKSI ============ */
        function fx(root){
        if(RM || !FINE) return;
        root.querySelectorAll(".gcard").forEach(c => {
        c.onpointermove = e => {
        const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        c.style.setProperty("--rx", ((.5 - y) * 7).toFixed(2) + "deg");
        c.style.setProperty("--ry", ((x - .5) * 9).toFixed(2) + "deg");
        c.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
        c.style.setProperty("--my", (y * 100).toFixed(1) + "%");
        };
        c.onpointerleave = () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); };
        });
        }

        function reveal(){
        app.classList.add("go");
        const els = document.querySelectorAll("#app .rv:not(.v), .foot .rv:not(.v)");
        if(RM || !("IntersectionObserver" in window)){ els.forEach(e => e.classList.add("v")); return; }
        const io = new IntersectionObserver(es => es.forEach(e => {
        if(e.isIntersecting){ e.target.classList.add("v"); io.unobserve(e.target); }
        }), {threshold: .12, rootMargin: "0px 0px -6% 0px"});
        els.forEach(e => io.observe(e));
        }

        /* kursor cincin & parallax blob */
        if(FINE && !RM){
        document.body.classList.add("cur");
        const ring = $("ring"), root = document.documentElement;
        let x = -100, y = -100, rx = x, ry = y;
        addEventListener("pointermove", e => {
        x = e.clientX; y = e.clientY;
        root.style.setProperty("--px", (x / innerWidth * 2 - 1).toFixed(3));
        root.style.setProperty("--py", (y / innerHeight * 2 - 1).toFixed(3));
        }, {passive: true});
        (function loop(){ rx += (x - rx) * .2; ry += (y - ry) * .2; ring.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); })();
        document.addEventListener("mouseover", e => {
        const t = e.target;
        ring.className = t.closest(".zm") ? "z" : t.closest("a,button,label,[tabindex],input") ? "h" : "";
        });
        }

        /* progress bar & header */
        const pg = $("prog"), hd = $("top");
        let tk = 0;
        addEventListener("scroll", () => {
        if(tk) return;
        tk = requestAnimationFrame(() => {
        tk = 0;
        const m = document.documentElement.scrollHeight - innerHeight;
        pg.style.transform = `scaleX(${m > 0 ? Math.min(1, scrollY / m) : 0})`;
        hd.classList.toggle("sc", scrollY > 24);
        });
        }, {passive: true});

        /* ============ LIGHTBOX ZOOM ============ */
        const lb = $("lb"), lbf = $("lbf"), lbi = $("lbi"), L = {list: [], i: 0, big: 0};
        function lbW(){
        const st = document.querySelector(".stage .screen"), sw = st ? st.getBoundingClientRect().width : 780;
        const fit = Math.min(innerWidth * .94, innerHeight * .86 * 16 / 9);
        return L.big ? Math.min(innerWidth * .98, innerHeight * .92 * 16 / 9) : Math.min(sw || 780, fit);
        }
        function lbSize(){ lbf.style.setProperty("--w", lbW() + "px"); lbf.classList.toggle("big", !!L.big); }
        function lbShow(i, dir){
        const n = L.list.length; L.i = (i + n) % n;
        const im = L.list[L.i];
        lbi.src = im.currentSrc || im.src; lbi.alt = im.alt;
        $("lbc").textContent = `${L.i + 1} / ${n}`;
        lb.classList.toggle("one", n < 2);
        if(dir && !RM) lbi.animate([{opacity: 0, transform: `translateX(${dir * 40}px)`}, {opacity: 1, transform: "none"}], {duration: 350, easing: "ease-out"});
        }
        function flip(from, to, ms, rev){
        const o = from.getBoundingClientRect(), f = to.getBoundingClientRect();
        const a = {transform: `translate(${o.left + o.width / 2 - f.left - f.width / 2}px,${o.top + o.height / 2 - f.top - f.height / 2}px) scale(${o.width / f.width})`, borderRadius: "20px"};
        const b = {transform: "none", borderRadius: "14px"};
        return to.animate(rev ? [b, a] : [a, b], {duration: ms, easing: "cubic-bezier(.2,.8,.2,1)", fill: rev ? "forwards" : "none"});
        }
        function lbOpen(list, i){
        L.list = list; L.big = 0;
        lbf.getAnimations().forEach(a => a.cancel()); $("lbg").getAnimations().forEach(a => a.cancel());
        lb.hidden = false; document.documentElement.style.overflow = "hidden";
        lbSize(); lbShow(i, 0);
        if(!RM){ flip(list[i], lbf, 540, false); $("lbg").animate([{opacity: 0}, {opacity: 1}], {duration: 400}); }
        $("lbx").focus({preventScroll: true});
        }
        function lbClose(){
        const t = L.list[L.i];
        const done = () => { lb.hidden = true; document.documentElement.style.overflow = ""; const f = t && t.closest("figure"); f && f.focus({preventScroll: true}); };
        if(RM || !t || !t.isConnected){ done(); return; }
        t.scrollIntoView({block: "nearest"});
        flip(t, lbf, 440, true).onfinish = done;
        $("lbg").animate([{opacity: 1}, {opacity: 0}], {duration: 420, fill: "forwards"});
        }
        function lbToggle(){ L.big ^= 1; lbSize(); }

        app.addEventListener("click", e => {
        const f = e.target.closest(".gal figure"), im = f && f.querySelector("img");
        if(!im) return;
        const list = [...app.querySelectorAll(".gal img")];
        lbOpen(list, list.indexOf(im));
        });
        app.addEventListener("keydown", e => {
        if((e.key === "Enter" || e.key === " ") && e.target.matches(".gal figure[tabindex]")){ e.preventDefault(); e.target.click(); }
        });
        $("lbx").onclick = lbClose; $("lbz").onclick = lbToggle; lbi.onclick = lbToggle;
        $("lbp").onclick = () => lbShow(L.i - 1, -1); $("lbn").onclick = () => lbShow(L.i + 1, 1);
        $("lbg").onclick = lbClose;
        lb.addEventListener("click", e => { if(e.target === lb) lbClose(); });
        document.addEventListener("keydown", e => {
        if(lb.hidden) return;
        if(e.key === "Escape") lbClose();
        else if(e.key === "ArrowLeft") lbShow(L.i - 1, -1);
        else if(e.key === "ArrowRight") lbShow(L.i + 1, 1);
        });
        let sx = 0;
        lbf.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive: true});
        lbf.addEventListener("touchend", e => {
        const d = e.changedTouches[0].clientX - sx;
        if(Math.abs(d) > 50 && L.list.length > 1) lbShow(L.i + (d < 0 ? 1 : -1), d < 0 ? 1 : -1);
        });
        addEventListener("resize", () => { if(!lb.hidden) lbSize(); });

        /* ============ ROUTING + TRANSISI HALAMAN ============ */
        const cv = $("curtain");
        let T;
        function render(){
        app.classList.remove("go");
        const m = location.hash.match(/^#\/g\/([\w-]+)/), i = m ? GAMES.findIndex(x => x.id === m[1]) : -1;
        i >= 0 ? game(GAMES[i], i) : home();
        window.scrollTo(0, 0);
        fx(app);
        }
        function wipe(){
        if(RM){ reveal(); return; }
        cv.style.transition = "clip-path .6s cubic-bezier(.7,0,.2,1)";
        cv.style.clipPath = "inset(0 0 100% 0)";
        setTimeout(reveal, 280);
        setTimeout(() => { cv.style.transition = "none"; cv.style.clipPath = "inset(100% 0 0 0)"; }, 650);
        }
        function nav(){
        clearTimeout(T);
        if(RM){ render(); reveal(); return; }
        cv.style.transition = "clip-path .5s cubic-bezier(.7,0,.2,1)";
        cv.style.clipPath = "inset(0)";
        T = setTimeout(() => { render(); wipe(); }, 540);
        }
        addEventListener("hashchange", nav);

        /* Inisialisasi awal */
        updateLangButtons();
        updateStaticText();
        render();
        setTimeout(wipe, RM ? 0 : 850);
    </script>
</body>
</html>

:root{color-scheme:light;--bg:#f8f4ea;--sea:#cdeaf5;--panel:#fffdf8;--text:#0b3b57;--muted:#4f7488;--accent:#0a7fb0;--ink:#fff;--line:#e4d9c2;--screen:#051a27;

html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(180deg,var(--sea),var(--bg) 460px);background-repeat:no-repeat;color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}

header{padding:20px 0}

.hero{padding:30px 0 28px;max-width:760px}
.hero h1{font-size:clamp(34px,8vw,68px);font-weight:800}
.hero p{margin:14px 0 0;font-size:17px;color:var(--muted);max-width:56ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;display:block;transition:border-color .2s,transform .2s}
.gcard:active{transform:scale(0.99)}
.gcard:hover{border-color:var(--accent)}
.cover{aspect-ratio:16/9;background:linear-gradient(135deg,var(--g1),var(--g2));overflow:hidden}
.cover img,.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gbody{padding:16px 18px 18px}
.gbody h2{font-size:24px}
.gbody span{font-size:13px;color:var(--muted);display:inline-block;margin-top:2px}
.gbody p{margin:8px 0 0;font-weight:600;font-size:15px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:500}

/* STAGE PREVIEW LEBIH COMPACT AGAR GIF TAJAM */
.stage{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px;margin:24px auto 0;max-width:780px}
.screen{aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center;color:#f4fbff;background:#051a27}
.screen iframe,.screen video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:cover}
.screen .gif-view{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#051a27;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}

.empty{text-align:center;padding:20px;max-width:460px;background:color-mix(in srgb,var(--screen) 80%,transparent);border-radius:16px}
.empty h3{font-size:22px;margin-bottom:6px}
.empty p{margin:0 0 12px;font-size:14px;color:#cfe6f1}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.row input[type=text]{flex:1 1 200px;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid #3f7a99;background:#0a2f45;color:#f4fbff;font-size:14px}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:10px;padding:10px 18px;font-weight:700;text-decoration:none;display:inline-block;text-align:center;min-height:44px;line-height:24px;transition:background .2s,border-color .2s,color .2s}
.btn.alt{background:transparent;border:1px solid currentColor;font-weight:600;color:inherit}
.sec{padding:44px 0 0}
.sec h2{font-size:26px;margin-bottom:6px}
.sec>p{margin:0 0 16px;color:var(--muted);max-width:64ch;font-size:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.gal figure{margin:0;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.slot{width:100%;height:100%;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 10px,var(--bg) 10px,var(--bg) 20px)}
.role{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.role b{font:700 20px "Bricolage Grotesque",system-ui,sans-serif;display:block}
.role ul{margin:12px 0 0;padding-left:20px;color:var(--muted);columns:2 260px;column-gap:28px}
.role li{margin-bottom:8px;break-inside:avoid;font-size:15px}
.work{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.job h3{font-size:20px}
.job .tag{font-size:12.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.job p{margin:8px 0 12px;color:var(--muted);font-size:14.5px}
.job ol{margin:0;padding:0;list-style:none;counter-reset:s}
.job li{counter-increment:s;display:flex;gap:10px;margin-bottom:8px;font-size:14.5px}
.job li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:var(--ink);font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:2px}
.next{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next .btn{flex:1 1 200px}
footer{margin-top:52px;padding:30px 0 40px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer h2{font-size:24px}

@media(max-width:600px){
  .wrap{padding:0 16px}
  .role ul{columns:1}
  .stage{border-radius:18px;padding:6px;max-width:100%}
  .screen{border-radius:12px}
}
</style>

        tag: "Keamanan Jaringan",
        what: "Menjaga kejutan identitas rusa dengan memastikan server hanya mengirim data visual yang berhak dilihat oleh Hunter.",
        how: [
          "Menghitung radius dan arah pandang Hunter langsung di sisi Server, bukan di sisi Client Hunter.",
          "Server memanggil fungsi NetworkHide untuk menyembunyikan entitas pemain rusa yang berada di luar jangkauan pandang.",
          "Menerapkan efek vignette visual di layar Hunter dan memastikan shading tidak menutupi informasi HUD antarmuka."
        ]
      },
      {
        t: "Sinkronisasi Bot Rusa & Siklus Match Flow",
        tag: "Gameplay Loop",
        what: "Menyamarkan pemain rusa di antara kerumunan bot NPC rusa yang bergerak secara identik dan tersinkronisasi.",
        how: [
          "Mensinkronisasikan posisi, animasi makan, dan pergerakan kawanan rusa di seluruh client via NetworkTransform.",
          "Memprogram fase permainan terstruktur: Fase Countdown, Fase Day Hunt (mencari makan), hingga Fase Malam.",
          "Membuat penentuan status akhir (Hunter Win / Deer Win) serta tombol Main Lagi (rematch) yang mereset scene dari keadaan bersih."
        ]
      }
    ]
  }
];
/* ============ SELESAI ============ */

const $ = id => document.getElementById(id), app = $("app");
$("brand").textContent = SITE.name;
$("cta").textContent = SITE.cta;

/* RENDER TOMBOL CONTACT & FITUR COPY EMAIL */
function copyEmail(email, btn){
  navigator.clipboard.writeText(email).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ Email Disalin!";
    btn.style.color = "var(--accent)";
    btn.style.borderColor = "var(--accent)";
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.color = "";
      btn.style.borderColor = "";
    }, 2000);
  }).catch(() => {
    prompt("Salin alamat email:", email);
  });
}
window.copyEmail = copyEmail;

$("contacts").innerHTML = SITE.contacts.map(c => {
  if(c.isCopy){
    return `<button class="btn alt" onclick="copyEmail('${c.email}', this)">${c.label}</button>`;
  }
  return `<a class="btn alt" href="${c.href}" target="_blank" rel="noopener">${c.label}</a>`;
}).join("");

function ytId(v){const m = String(v).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : "")}

/* FUNGSI PLAYBACK MEMASTIKAN GIF TAJAM DAN TIDAK MELAR */
function play(kind, val){
  if(kind === "yt"){
    $("screen").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${val}" title="Video gameplay" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  } else if(/\.gif($|\?)/i.test(val)){
    $("screen").innerHTML = `<img src="${val}" alt="Cuplikan gameplay animasi" class="gif-view" loading="lazy">`;
  } else {
    $("screen").innerHTML = `<video src="${val}" controls autoplay loop muted playsinline></video>`;
  }
}

function showEmpty(){
  $("screen").innerHTML = `<div class="empty"><h3>Animasi gameplay belum terpasang</h3><p>Pastikan file GIF berada di tempat yang sama dengan <code>index.html</code>.</p>
  <div class="row"><input type="text" id="url" placeholder="Contoh: reverie.gif" aria-label="Link video"><button class="btn" id="go">Putar</button></div>
  <div class="row"><label class="btn alt" style="cursor:pointer">Pilih file GIF/Video lokal<input type="file" id="file" accept="video/*,image/gif" hidden></label></div></div>`;
  $("go").onclick = () => {const v = $("url").value.trim(); if(!v) return; const id = ytId(v); id ? play("yt", id) : play("file", v)};
  $("file").onchange = e => {const f = e.target.files[0]; if(f) play("file", URL.createObjectURL(f))};
}

function slot(i, src){
  return src ? `<img src="${src}" alt="Cuplikan layar ${i + 1}" loading="lazy">`
             : `<label class="slot">Tambah foto ${i + 1}<input type="file" accept="image/*" hidden></label>`;
}

function home(){
  document.title = SITE.name + " | Portofolio Game Developer";
  app.innerHTML = `<div class="hero"><h1>${SITE.headline}</h1><p>${SITE.intro}</p></div>
  <div class="cards">${GAMES.map(g => `<a class="gcard" href="#/g/${g.id}"><div class="cover" style="--g1:${g.g[0]};--g2:${g.g[1]}">${g.photos[0] ? `<img src="${g.photos[0]}" alt="" loading="lazy">` : ""}</div>
  <div class="gbody"><h2>${g.title}</h2><span>${g.genre}</span><p>${g.short}</p></div></a>`).join("")}</div>`;
}

function game(g, idx){
  document.title = g.title + " | " + SITE.name;
  const n = Math.max(3, g.photos.length), nx = GAMES[(idx + 1) % GAMES.length];
  app.innerHTML = `<a class="back" href="#/">← Semua game</a>
  <div class="top"><h1>${g.title}</h1><p>${g.desc}</p>
    <div class="chips"><span class="chip">${g.genre}</span><span class="chip">${g.status}</span>${g.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div></div>
  <div class="stage"><div class="screen" id="screen" style="--g1:${g.g[0]};--g2:${g.g[1]}"></div></div>
  <section class="sec"><h2>Foto game</h2><div class="gal">${Array.from({length: n}, (_, i) => `<figure>${slot(i, g.photos[i])}</figure>`).join("")}</div></section>
  <section class="sec"><h2>Peran saya</h2><div class="role"><b>${g.role}</b><ul>${g.duties.map(d => `<li>${d}</li>`).join("")}</ul></div></section>
  <section class="sec"><h2>Kerjaan saya dan cara mengembangkannya</h2><p>${g.method}</p>
    <div class="work">${g.work.map(w => `<article class="job"><span class="tag">${w.tag}</span><h3>${w.t}</h3><p>${w.what}</p><ol>${w.how.map(h => `<li>${h}</li>`).join("")}</ol></article>`).join("")}</div></section>
  <div class="next"><a class="btn alt" href="#/">Semua game</a>${GAMES.length > 1 ? `<a class="btn" href="#/g/${nx.id}">Game berikutnya: ${nx.title} →</a>` : ""}</div>`;
  
  const id = g.youtube && ytId(g.youtube);
  id ? play("yt", id) : g.src ? play("file", g.src) : showEmpty();
  
  app.querySelectorAll(".slot input").forEach(inp => inp.onchange = e => {
    const f = e.target.files[0]; if(f) inp.closest("figure").innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Cuplikan layar">`;
  });
}

function route(){
  const m = location.hash.match(/^#\/g\/([\w-]+)/), i = m ? GAMES.findIndex(x => x.id === m[1]) : -1;
  i >= 0 ? game(GAMES[i], i) : home();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
